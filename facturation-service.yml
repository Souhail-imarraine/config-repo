spring:
  application:
    name: facturation-service
  cloud:
    config:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/facture_db?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8083

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    healthcheck:
      enabled: true

# Disable Feign built-in circuit breaker so our @Retry executes before the CircuitBreaker
feign:
  circuitbreaker:
    enabled: false

# Resilience4j configuration: Retry (3 attempts, 500ms) and CircuitBreaker for produit-service
resilience4j:
  retry:
    instances:
      produit-service:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: false
      client-service:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: false
  circuitbreaker:
    instances:
      produit-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      client-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics,retries,retryevents,circuitbreakers,circuitbreakerevents
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true
    diskSpace:
      enabled: true
    eureka:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
