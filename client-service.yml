spring:
  datasource:
    url: jdbc:mysql://localhost:3306/client-service
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  cloud:
    discovery:
      enabled: true
    config:
      enabled: true